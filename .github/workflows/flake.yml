# The gate is the flake: CI only runs `nix flake check`, through burrow's
# shared workflow. Jobs the flake can't hold (browsers, VMs) go alongside.
#
# The repository lands through its merge train, and conaryd counts a required
# check only as an attestation of the tree that lands. So the gate also runs on
# each train candidate (a push to a conary/train/ branch: main with the PRs in
# it on top), on a GitHub-hosted runner, and attests that tree.
name: flake
on:
  pull_request:
  push:
    branches: [main, "conary/train/**"]
jobs:
  check:
    uses: FieldmouseWorks/burrow/.github/workflows/flake-check.yml@5fe4bb5868149b51bdb3cf2a555eb297ab41951a # main
    # What the shared workflow asks for to attest its result for Conary's
    # ledger. A called job gets no more than its caller grants, and asking for
    # more than that fails the run before it starts.
    permissions:
      contents: read
      id-token: write
      attestations: write
