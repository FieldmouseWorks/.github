# The gate is the flake: CI only runs `nix flake check`, through burrow's
# shared workflow. Jobs the flake can't hold (browsers, VMs) go alongside.
name: flake
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    uses: FieldmouseWorks/burrow/.github/workflows/flake-check.yml@9b0adfe79f89f6e18b854518d3d3bdaf8855da2f # main
    # What the shared workflow asks for to attest its result for Conary's
    # ledger. A called job gets no more than its caller grants, and asking for
    # more than that fails the run before it starts.
    permissions:
      contents: read
      id-token: write
      attestations: write
